name: Spark Commercial Readiness & Security Gate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-build-and-tests:
    name: TypeScript, Firestore Rules, Unit Tests & Production Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PAYPAL_ENV: sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript static typecheck
        run: npm run lint

      - name: Lint Firestore security rules
        run: npx eslint firestore.rules

      - name: Run unit, security, and subscription quota test suites
        run: npm test

      - name: Verify production Vite bundle build
        run: npm run build
